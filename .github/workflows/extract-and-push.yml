name: Extract TinyPic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TinyPic-Compressor.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip TinyPic
        run: |
          unzip -o "TinyPic-Compressor.zip" -d .
          # Handle if zip contains a top-level folder
          if [ -d "TinyPic-Compressor" ]; then
            shopt -s dotglob
            mv TinyPic-Compressor/* . || true
            rmdir TinyPic-Compressor || true
          fi
          # Also handle common extracted folder name variations
          for d in TinyPic* ; do
            if [ -d "$d" ] && [ "$d" != ".github" ]; then
              if [ -f "$d/settings.gradle" ] || [ -f "$d/settings.gradle.kts" ] || [ -f "$d/build.gradle" ]; then
                shopt -s dotglob
                mv "$d"/* . || true
                rmdir "$d" || true
                break
              fi
            fi
          done
          ls -R
          rm -f TinyPic-Compressor.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Extract TinyPic project files"
          git push
