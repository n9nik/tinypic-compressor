name: Android Cloud Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip template if present
        run: |
          if [ -f "Base App Template.zip" ]; then
            unzip -o "Base App Template.zip" -d .
          fi
          if [ -f "TinyPic-Compressor.zip" ]; then
            unzip -o "TinyPic-Compressor.zip" -d .
          fi
          ls -R

      - name: Find Android project
        id: project
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "dir=$PWD" >> $GITHUB_OUTPUT
          else
            dir=$(find . -maxdepth 3 -name "settings.gradle*" | head -1 | xargs dirname)
            echo "dir=$PWD/$dir" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Build release AAB for Play Console
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          ./gradlew --no-daemon bundleRelease -PADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713 -PADMOB_BANNER_ID=ca-app-pub-3940256099942544/6300978111

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: '**/build/outputs/bundle/release/*.aab'
